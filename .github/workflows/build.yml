name: Build iOS IPA Native App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Project & Download Source
        run: |
          mkdir -p project/www
          cd project
          curl -L -o source.zip "https://drive.usercontent.google.com/download?id=1DtFuxUV9C0L7R6KX5_y-v4WARvxogbIQ&export=download"
          unzip -o source.zip -d www/
          
          cat << 'EOF' > package.json
          {
            "name": "gps-speedometer",
            "version": "2.0.0",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/ios": "^6.0.0",
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gps.speedometer.app",
            "appName": "GPS Speedometer",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add ios

      - name: Inject iOS Background Location (Info.plist)
        run: |
          cd project/ios/App/App
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string audio" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Cần GPS chạy nền liên tục để đo tốc độ.'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Cần GPS để đo tốc độ thời gian thực.'" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysUsageDescription string 'Cần GPS chạy nền khi tắt màn hình.'" Info.plist || true

      - name: Build Native IPA with Xcode
        run: |
          cd project/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r GPS_Speedometer_Release.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPS_Speedometer_Release_IPA
          path: project/ios/App/build/GPS_Speedometer_Release.ipa
